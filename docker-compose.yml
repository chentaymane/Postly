services:
  postgres:
    image: postgres:16-alpine
    container_name: postly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postly}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run only on first boot (empty data dir). They create the
      # `postly` app database and the post_logs table used for logging.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postly} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: postly-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postly}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-postly}
      # --- Host / webhook ---
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # WEBHOOK_URL must be reachable by external platforms for OAuth callbacks.
      # Locally use http://localhost:5678/ ; in prod use your public https URL.
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # --- Security ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # Local dev over http needs secure cookies disabled to log in.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      # Allow workflows to read process env via {{ $env.NAME }} (used for API keys).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- Misc ---
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_ENV: production
      # --- App secrets/config exposed to workflows as $env.* ---
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HUGGINGFACE_IMAGE_MODEL: ${HUGGINGFACE_IMAGE_MODEL:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${INSTAGRAM_BUSINESS_ACCOUNT_ID:-}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN:-}
      X_ACCESS_TOKEN_SECRET: ${X_ACCESS_TOKEN_SECRET:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      LINKEDIN_ORGANIZATION_URN: ${LINKEDIN_ORGANIZATION_URN:-}
      PINTEREST_ACCESS_TOKEN: ${PINTEREST_ACCESS_TOKEN:-}
      PINTEREST_BOARD_ID: ${PINTEREST_BOARD_ID:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ASSEMBLY_URL: ${ASSEMBLY_URL:-http://assembly:3000}
      # Lets the sharp assembly microservice be reached as http://assembly:3000
      # from inside n8n Code/HTTP nodes.
    volumes:
      - n8n_data:/home/node/.n8n
      # Shared folder for exported/imported workflow JSON.
      - ./n8n/workflows:/workflows

  # --- Phase 3: post-assembly microservice (sharp) ---
  # Commented out until Phase 3. Uncomment to enable image compositing.
  # assembly:
  #   build: ./services/assembly
  #   container_name: postly-assembly
  #   restart: unless-stopped
  #   ports:
  #     - "${ASSEMBLY_PORT:-3000}:3000"
  #   environment:
  #     PORT: 3000

volumes:
  postgres_data:
  n8n_data:
